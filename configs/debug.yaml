# DEBUG mode: tiny synthetic dataset + tiny BERT; runs end-to-end on CPU in minutes.
# Numbers produced with this config are NOT benchmark results.
inherit: base.yaml

output_dir: experiments/debug/rat_debug

data:
  dataset: synthetic
  root: data/samples/synthetic
  processed_dir: data/processed/synthetic

preprocess:
  validation:
    fraction: 0.0          # synthetic train has only 3 databases; validate on the synthetic dev DBs

model:
  encoder:
    pretrained_model: google/bert_uncased_L-2_H-128_A-2   # BERT-tiny (4.4M parameters)
  rat:
    d_model: 128
    num_layers: 2
    num_heads: 4
    ff_dim: 256
  decoder:
    hidden: 128
    action_dim: 64
    type_dim: 32
    att_heads: 4
    pointer_dim: 128

train:
  epochs: 40
  batch_size: 16
  lr: 1.0e-3
  bert_lr: 1.0e-4
  eval_every: 5
  log_every: 20
